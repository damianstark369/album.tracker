<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album Tracker</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div id="albumcontainer" class="container mt-5" style="max-width: 500px;">
    Texto dentro del elemento contenedor
    <p> Hola </p>
    <div class="card shadow-sm p-4">
      <h2 class="text-center mb-4">Album Tracker</h2>

      <form id="albumform">
        <fieldset>
        <div class="mb-3">
          <label class="form-label">Título</label>
          <input name="Tittle" type="text" class="form-control" placeholder="Siempre es hoy">
        </div>

        <div class="mb-3">
          <label class="form-label">Artista</label>
          <input name="Artist" type="text" class="form-control" placeholder="Gustavo Cerati">
        </div>

        <div class="mb-3">
          <label class="form-label">Año de Lanzamiento</label>
          <input name="ReleaseYear" type="text" class="form-control" placeholder="2003">
        </div>

        <div class="mb-3">
          <label class="form-label">Género</label>
          <input name="Genre" type="text" class="form-control" placeholder="Poprock-electronica">
        </div>

        <div class="mb-3">
          <label class="form-label">Rating</label>
          <input name="Raiting" type="text" class="form-control" placeholder="85/100">
        </div>

        <div class="mb-3">
          <label class="form-label">Escuchantes</label>
          <input name="Listened" type="text" class="form-control" placeholder="5.1M">
        </div>
     </fieldset>
        <button type="submit" class="btn btn-primary w-100">Guardar</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
